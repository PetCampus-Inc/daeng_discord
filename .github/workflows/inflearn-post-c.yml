name: post-c

on:
  schedule:
    # Check at 10:00 KST daily; the cadence gate below runs scheduled posts every 48 hours.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "폼만 채우고 등록은 안 함 (true/false)"
        type: boolean
        default: false
      cleanup_all:
        description: "Knockdog 모집글 전체 삭제 후 새 글 등록 안 함"
        type: boolean
        default: false

concurrency:
  group: inflearn-session
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Decide whether this run should post
        id: cadence
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          epoch_day=$(( $(date -u +%s) / 86400 ))
          if [ $((epoch_day % 2)) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cadence.outputs.should_run == 'true'

      - uses: actions/setup-node@v4
        if: steps.cadence.outputs.should_run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        if: steps.cadence.outputs.should_run == 'true'
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        if: steps.cadence.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Restore Inflearn session
        if: steps.cadence.outputs.should_run == 'true'
        run: |
          mkdir -p scripts/inflearn
          echo "${{ secrets.INFLEARN_STATE_B64 }}" | base64 -d > scripts/inflearn/state.json
          test -s scripts/inflearn/state.json

      - name: Post recruitment article to Inflearn
        if: steps.cadence.outputs.should_run == 'true'
        env:
          INFLEARN_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          INFLEARN_DELETE_ALL_KNOCKDOG: ${{ inputs.cleanup_all && '1' || '' }}
          INFLEARN_CLEANUP_ONLY: ${{ inputs.cleanup_all && '1' || '' }}
        run: node scripts/inflearn/post.js

      - name: Upload debug screenshots
        if: always() && steps.cadence.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inflearn-debug-${{ github.run_id }}
          path: /tmp/inflearn-debug
          if-no-files-found: ignore
          retention-days: 7

      - name: Rotate INFLEARN_STATE_B64 secret with refreshed cookies
        if: success() && steps.cadence.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_PAT 가 없어서 secret 갱신을 건너뜁니다."
            exit 0
          fi
          node - scripts/inflearn/state.json /tmp/inflearn-state-compact.json <<'NODE'
          const fs = require("fs");
          const [, , input, output] = process.argv;
          const state = JSON.parse(fs.readFileSync(input, "utf8"));
          const compact = {
            cookies: (state.cookies || []).filter((cookie) =>
              String(cookie.domain || "").includes("inflearn.com")
            ),
            origins: (state.origins || [])
              .filter((origin) => {
                try {
                  return new URL(origin.origin).hostname.endsWith("inflearn.com");
                } catch (_) {
                  return false;
                }
              })
              .map((origin) => ({
                origin: origin.origin,
                localStorage: (origin.localStorage || []).filter(
                  (item) => !String(item.name || "").startsWith("hackle-workspace-config_")
                ),
                indexedDB: origin.indexedDB || [],
              })),
          };
          fs.writeFileSync(output, JSON.stringify(compact));
          NODE
          NEW=$(base64 -w0 /tmp/inflearn-state-compact.json)
          echo -n "$NEW" | gh secret set INFLEARN_STATE_B64 --repo "${{ github.repository }}"
          echo "INFLEARN_STATE_B64 갱신 완료"

      - name: Discord alert on failure
        if: failure() && steps.cadence.outputs.should_run == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          curl -s -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg msg "⚠️ Inflearn 자동 게시(post-c) 실패. 'node scripts/inflearn/login.js' 재로그인 후 INFLEARN_STATE_B64 재업로드. 로그: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{content: $msg}')"
